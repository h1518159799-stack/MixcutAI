[project]
name = "mixcut-ai-desktop"
version = "1.3.6"
description = "Windows AI 视频混剪、批量生成与多平台发布桌面软件"
requires-python = ">=3.11,<3.15"
dependencies = [
  "Pillow",
  "cryptography>=42,<46",
  "edge-tts>=7,<8",
  "playwright>=1.48,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

